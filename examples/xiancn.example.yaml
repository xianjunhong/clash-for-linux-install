# xiancn.top 本地订阅示例：来自服务器实际源 YAML 的脱敏副本。
# 使用前将全零 UUID 替换为 x-ui / My-CDN-Node 下自己的客户端 UUID。
# 不要将填入真实 UUID、密码或密钥的配置提交到 Git。
# 一个 VLESS + WebSocket + TLS 节点；35 个策略组、45 条源规则。
# 六个地区策略组仅含 DIRECT；使用代理请选择 My-CDN-Node 或自动选择。
# 实际部署经 Mixin 合并后有 46 条规则；端口、DNS、TUN 等也可能被覆盖。
# 保留了源文件的 allow-lan: true；当前服务器由 Mixin 覆盖为 false。
# GEOSITE/GEOIP 规则依赖 geosite.dat 和 Country.mmdb，使用安装目录 resources 作为数据目录。
# rule-providers 会下载对应的公开规则文件，需要网络可达。
port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
proxies:
- name: My-CDN-Node
  server: xiancn.top
  port: 443
  client-fingerprint: chrome
  encryption: none
  network: ws
  servername: xiancn.top
  tls: true
  type: vless
  udp: true
  uuid: 00000000-0000-0000-0000-000000000000
  ws-opts:
    headers:
      Host: xiancn.top
      User-Agent: Mozilla/5.0 (Windows NT 6.1; WOW64) AppleWebKit/537.36 (KHTML, like
        Gecko) Chrome/50.0.2661.102 Safari/537.36
    path: /blog
  xudp: true
proxy-groups:
- name: 🚀 手动选择
  type: select
  proxies:
  - ♻️ 自动选择
  - 🇭🇰 香港节点
  - 🇺🇸 美国节点
  - 🇯🇵 日本节点
  - 🇸🇬 新加坡节点
  - 🇼🇸 台湾节点
  - 🇰🇷 韩国节点
  - My-CDN-Node
- name: ♻️ 自动选择
  type: url-test
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 50
  proxies:
  - My-CDN-Node
